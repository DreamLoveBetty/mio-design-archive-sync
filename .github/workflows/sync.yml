name: Sync Mio Design Archive to Google Drive

on:
  schedule:
    # Runs daily at 20:00 UTC (04:00 Asia/Shanghai)
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      force_update:
        description: "Force re-download and re-upload all files"
        required: false
        type: boolean
        default: false
      dry_run:
        description: "Run rclone with --dry-run without modifying Google Drive"
        required: false
        type: boolean
        default: false

concurrency:
  group: mio-design-archive-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone
          rclone version

      - name: Configure rclone
        env:
          RCLONE_CONFIG_CONTENT: ${{ secrets.RCLONE_CONFIG }}
        run: |
          if [ -z "$RCLONE_CONFIG_CONTENT" ]; then
            echo "::error::Missing repository secret RCLONE_CONFIG. See README.md for setup instructions."
            exit 1
          fi
          umask 077
          mkdir -p "$HOME/.config/rclone"
          printf '%s\n' "$RCLONE_CONFIG_CONTENT" > "$HOME/.config/rclone/rclone.conf"
          chmod 600 "$HOME/.config/rclone/rclone.conf"

      - name: Run incremental archive sync
        env:
          RCLONE_REMOTE: ${{ vars.RCLONE_REMOTE || 'gdrive:Mio-Design-Archive' }}
          FORCE_UPDATE: ${{ inputs.force_update || 'false' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          args=(--backend rclone --rclone-remote "$RCLONE_REMOTE")
          if [ "$FORCE_UPDATE" = "true" ]; then
            args+=(--force-update)
          fi
          if [ "$DRY_RUN" = "true" ]; then
            args+=(--dry-run)
          fi
          python3 sync.py "${args[@]}"

      - name: Clean up rclone config
        if: always()
        run: rm -f "$HOME/.config/rclone/rclone.conf"
