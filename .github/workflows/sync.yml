name: Sync Mio Design Archive to GitHub

on:
  schedule:
    # Runs daily at 20:00 UTC (04:00 Asia/Shanghai)
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      force_update:
        description: "Force re-download all images"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: mio-design-archive-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run incremental archive sync
        env:
          FORCE_UPDATE: ${{ inputs.force_update || 'false' }}
        run: |
          args=()
          if [ "$FORCE_UPDATE" = "true" ]; then
            args+=(--force-update)
          fi
          python3 sync.py "${args[@]}"

      - name: Commit and push archive updates
        run: |
          if [ -z "$(git status --porcelain archive/)" ]; then
            echo "No changes under archive/ to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A archive/
          git commit -m "chore(archive): sync Mio Design Archive ($(date -u +%Y-%m-%d))"
          git push
